# Render.com Blueprint — one-click full-stack deploy of DealProof.
# New → Blueprint → connect this repo → pick the DealProof branch → Apply.
# Creates one web service (API + React UI in a single container) and a managed
# Postgres. The public URL Render assigns is reachable from your phone.

services:
  - type: web
    name: dealproof
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    branch: claude/dealproof-diligence-platform-spy5jm
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dealproof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      # Demo mode: /api/auth/request returns the magic token in the response so
      # you can log in without wiring an email provider. Set to "production" and
      # add RESEND_API_KEY to email real magic links instead.
      - key: ENV
        value: development
      # Optional: switch report narration from the deterministic writer to Claude.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional hardening for a real (paying) deployment — see PRODUCTION_READINESS.md:
      #   RESEND_API_KEY  — email real magic links (required when ENV=production)
      #   APP_BASE_URL    — public URL used to build the magic-link (e.g. https://dealproof.onrender.com)
      #   CLAMAV_HOST     — host of a clamd daemon to virus-scan uploads (fail-closed)
      #   MAX_UPLOAD_MB   — per-file upload cap (default 25)
      - key: RESEND_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  - name: dealproof-db
    plan: free
