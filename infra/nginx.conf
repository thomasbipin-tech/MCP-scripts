# DealProof reverse proxy: fronts the `web` (static frontend) and `api`
# (FastAPI/uvicorn) services. Long timeouts + a raised body-size limit since
# diligence document uploads (bank statements, tax returns, PDFs) can be
# large and slow to transfer.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Diligence uploads (bank statements, tax returns) can be large.
    client_max_body_size 100m;

    upstream web_upstream {
        server web:80;
    }

    upstream api_upstream {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Long timeouts to tolerate slow uploads/large document processing
        # requests without the proxy cutting the connection early.
        proxy_connect_timeout 75s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;

        location /api/ {
            proxy_pass http://api_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://web_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
