[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealproof-backend"
version = "0.1.0"
description = "DealProof — AI-native due-diligence red-flag engine and API"
requires-python = ">=3.11"

# NOTE: the deterministic engine + rules + tests run on the STDLIB ONLY.
# These dependencies are for the API/pipeline layer (§7); the core test suite
# (test_money / test_reconcile / test_rules / test_grounding / test_seed_golden)
# does not import any of them, so `pytest` is green in a bare interpreter.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.3",
    "anthropic>=0.40",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "weasyprint>=61",
    "stripe>=9.0",
    "resend>=2.0",
    "sentry-sdk>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 100
