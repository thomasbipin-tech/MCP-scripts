[alembic]
# Path to migration scripts.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps (leave blank for local time).
timezone =

# Max length of the slug in migration filenames.
truncate_slug_length = 40

# sqlalchemy.url is deliberately left unset here — env.py reads the real
# value from the DATABASE_URL environment variable at runtime so the same
# config works in Docker Compose, CI, and local dev without editing this
# file. This placeholder keeps `alembic` happy if invoked without env.py
# doing its job (e.g. `alembic -c alembic.ini current` before env vars are
# sourced).
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# No post-write hooks configured.

# --- Logging -----------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
