name: Deploy sample to GitHub Pages

# Publishes the DealProof frontend (marketing page + interactive sample report +
# browsable source PDFs) as a static site. This is the sample/demo experience —
# it needs no backend. The full app (auth, upload, processing) runs via
# docker compose. See README.

# Manual-only: this repo's single GitHub Pages site is used by another app
# (AI Music Studio) which deploys from the default branch. To avoid the two
# fighting over one URL, DealProof only publishes to Pages when you explicitly
# run this workflow. Prefer a separate host (see README) if you want both live.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend (relative base for project Pages subpath)
        working-directory: frontend
        run: |
          npm install
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
