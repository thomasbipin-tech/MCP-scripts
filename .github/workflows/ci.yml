name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest
        # The core engine test suite (test_money / test_reconcile / test_rules /
        # test_grounding / test_seed_golden / test_traceability) runs on the
        # stdlib only -- no other backend dependencies are required here.

      - name: Run backend tests
        run: cd backend && python -m pytest -q

  frontend-build:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Build
        run: cd frontend && npm run build
