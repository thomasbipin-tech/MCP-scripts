<!doctype html>
<meta charset="utf-8">
<title>Netforge.ai demo — frame renderer</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-400.woff2)format('woff2');font-weight:400;font-display:block}
@font-face{font-family:Inter;src:url(fonts/inter-500.woff2)format('woff2');font-weight:500;font-display:block}
@font-face{font-family:Inter;src:url(fonts/inter-600.woff2)format('woff2');font-weight:600;font-display:block}
@font-face{font-family:Inter;src:url(fonts/inter-700.woff2)format('woff2');font-weight:700;font-display:block}
@font-face{font-family:JBMono;src:url(fonts/jbmono-400.woff2)format('woff2');font-weight:400;font-display:block}
@font-face{font-family:JBMono;src:url(fonts/jbmono-500.woff2)format('woff2');font-weight:500;font-display:block}

:root{
  --bg:#000; --bg2:#0a0a0c; --elev:#1c1c1e;
  --bd:#ffffff1a; --bd2:#ffffff29; --bd3:#ffffff3d; --edge:#ffffff0f;
  --tp:#f5f5f7; --ts:#98989f; --tt:#aeaeb2; --tph:#48484a;
  --ac:#38bdf8; --ac2:#0ea5e9; --acs:#38bdf824; --acb:#38bdf840; --acg:#38bdf857;
  --ok:#34c759; --okb:#34c7591a; --err:#ff3b30; --errb:#ff3b301a;
  --warn:#ff9f0a; --warnb:#ff9f0a1a; --info:#007aff; --infob:#007aff1a;
  --cisco:#1ba0d7; --arista:#ed1c24; --aruba:#ff8300; --sp:#00adef; --gen:#8e8e93;
  --fiber:#007aff; --copper:#8e8e93; --down:#ff3b30;
  --dot:#ffffff29; --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --shadow-node:0 2px 12px #000000b3, 0 0 0 1px #ffffff12;
  --topbar:50px; --sbl:272px; --sbr:600px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Inter,sans-serif;color:var(--tp);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000}
.layer{position:absolute;inset:0}
.hide{display:none!important}
.mono{font-family:JBMono,monospace}

/* ---------- kinetic type ---------- */
.kin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 200px;text-align:center}
.kin .l{font-size:60px;line-height:1.22;font-weight:600;letter-spacing:-1.4px}
.kin .l.sm{font-size:44px;font-weight:500;color:var(--ts);letter-spacing:-.6px}
.kin .l.em{color:var(--ac)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 50%,#0000 0%,#000000ad 100%);pointer-events:none}

/* ---------- act 1 diff ---------- */
.diff{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1180px}
.diff .dh{display:flex;align-items:center;gap:20px;padding:0 6px 16px;font-size:19px;color:var(--ts)}
.diff .dh .a,.diff .dh .b{font-family:JBMono,monospace;font-size:17px;color:var(--tt)}
.diff .dh .b{margin-left:auto}
.diff .dh .vs{font-size:13px;letter-spacing:2.2px;text-transform:uppercase;color:var(--err);
  border:1px solid #ff3b3059;background:var(--errb);border-radius:99px;padding:6px 14px;font-weight:600}
.diff .dr{display:flex;align-items:center;gap:22px;padding:17px 22px;border-radius:var(--r-md);
  background:#ffffff06;border:1px solid var(--bd);margin-bottom:10px}
.diff .dr .lv,.diff .dr .rv{font-family:JBMono,monospace;font-size:23px;width:330px}
.diff .dr .lv{color:var(--ts);text-decoration:line-through;text-decoration-color:#ff3b3080}
.diff .dr .rv{color:var(--tp)}
.diff .dr .x{width:24px;height:24px;border-radius:99px;background:var(--err);flex:0 0 24px;
  display:flex;align-items:center;justify-content:center}
.diff .dr .x svg{width:13px;height:13px}
.diff .dr .note{margin-left:auto;font-size:15px;color:var(--warn)}
.diff .df{padding:14px 6px 0;font-size:17px;color:var(--tt);font-family:JBMono,monospace}

/* ---------- act 1 split ---------- */
.pane{position:absolute;top:196px;height:672px;width:760px;border-radius:var(--r-lg);background:var(--bg2);border:1px solid var(--bd);overflow:hidden}
.pane .ph{height:44px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:15px;color:var(--ts);font-weight:500}
.dotrow{display:flex;gap:6px}.dotrow i{width:10px;height:10px;border-radius:99px;display:block}
.stamp{position:absolute;right:22px;top:64px;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-xs);padding:5px 10px;font-weight:600;transform:rotate(-3deg);background:var(--warnb)}
.cli{padding:20px 22px;font-family:JBMono,monospace;font-size:16.5px;line-height:1.85;color:#c9d4de;white-space:pre-wrap}
.cli b{color:var(--ac);font-weight:500}.cli u{color:var(--ok);text-decoration:none}.cli s{color:#5f6b76;text-decoration:none}
.gaplabel{position:absolute;top:60px;font-size:17px;letter-spacing:2.6px;text-transform:uppercase;color:var(--tt);font-weight:600}

/* ---------- app chrome ---------- */
#app{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column}
.topbar{height:var(--topbar);flex:0 0 var(--topbar);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:16px;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.3px}
.logo .m{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.logo .m svg{width:24px;height:24px}
.crumb{font-size:13.5px;color:var(--ts)}.crumb b{color:var(--tp);font-weight:500}
.tbtns{margin-left:auto;display:flex;align-items:center;gap:9px}
.btn{height:32px;padding:0 15px;border-radius:99px;border:1px solid var(--bd2);background:#ffffff0a;color:var(--tp);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#00121c;font-weight:600}
.btn.on{background:var(--acs);border-color:var(--acb);color:var(--ac)}
.av{width:28px;height:28px;border-radius:99px;background:linear-gradient(135deg,#38bdf8,#0369a1);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#00121c}
.body{flex:1;display:flex;min-height:0}

/* left palette */
.sbl{width:var(--sbl);flex:0 0 var(--sbl);background:var(--bg2);border-right:1px solid var(--bd);padding:16px 12px;overflow:hidden}
.sbtitle{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tt);font-weight:600;padding:0 8px;margin:14px 0 9px}
.sbtitle:first-child{margin-top:0}
.chip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);font-size:13.5px;color:var(--tp);border:1px solid transparent}
.chip .sw{width:26px;height:26px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;border:1px solid var(--bd2)}
.chip .sw svg{width:15px;height:15px}
.chip small{margin-left:auto;font-size:11px;color:var(--tph);font-family:JBMono,monospace}
.chip.act{background:var(--acs);border-color:var(--acb)}

/* canvas */
.cv{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle,var(--dot) 1px,#0000 1.2px) 0 0/26px 26px,
  var(--bg)}
.cvinner{position:absolute;inset:0;transform-origin:50% 50%}
.node{position:absolute;width:186px;border-radius:var(--r-md);background:var(--elev);box-shadow:var(--shadow-node);border:1px solid var(--edge);overflow:hidden}
.node .nh{display:flex;align-items:center;gap:9px;padding:10px 12px 8px}
.node .ic{width:28px;height:28px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;flex:0 0 28px}
.node .ic svg{width:16px;height:16px}
.node .nm{font-size:13px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.node .vd{font-size:10.5px;color:var(--ts);font-family:JBMono,monospace;margin-top:1px}
.node .ports{display:flex;gap:3px;padding:0 12px 11px;flex-wrap:wrap}
.node .ports i{width:13px;height:7px;border-radius:2px;background:#ffffff0f;display:block}
.node .ports i.up{background:var(--ok)}
.node .ports i.fib{background:var(--fiber)}
.node.sel{box-shadow:0 0 0 2px var(--ac),0 6px 20px #38bdf866}
.node.bad{box-shadow:0 0 0 2px var(--err),0 6px 20px #ff3b3066}
.node.sm{width:126px}.node.sm .nm{font-size:11.5px}.node.sm .vd{font-size:9.5px}
.node.sm .ic{width:22px;height:22px;flex:0 0 22px}.node.sm .ic svg{width:13px;height:13px}
.node.sm .nh{padding:8px 10px 6px;gap:7px}.node.sm .ports{padding:0 10px 8px}
.node.sm .ports i{width:9px;height:5px}
#links{position:absolute;inset:0;overflow:visible;pointer-events:none}

/* right panel */
.sbr{width:var(--sbr);flex:0 0 var(--sbr);background:var(--bg2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.prh{padding:15px 20px 0}
.prh .t{font-size:17px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.prh .s{font-size:12.5px;color:var(--ts);margin-top:3px;font-family:JBMono,monospace}
.tabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--bd);margin-top:14px}
.tabs div{font-size:13.5px;color:var(--ts);padding:0 0 10px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs div.on{color:var(--ac);border-bottom-color:var(--ac)}
.pbody{padding:16px 20px;overflow:hidden;flex:1}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tt);font-weight:600;margin-bottom:6px}
.fld .inp{height:38px;border-radius:var(--r-sm);border:1px solid var(--bd2);background:#ffffff08;display:flex;align-items:center;padding:0 13px;font-size:14px;font-family:JBMono,monospace;color:var(--tp)}
.fld .inp.foc{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--ac);vertical-align:-3px;margin-left:1px}

/* validation rows */
.vrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #ffffff0d;font-size:14px}
.vrow .b{width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:0 0 19px}
.vrow .b svg{width:11px;height:11px}
.vrow .nmx{color:var(--tp)}.vrow .mt{margin-left:auto;font-family:JBMono,monospace;font-size:12px;color:var(--tph)}
.vsum{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);border:1px solid;margin-bottom:14px;font-size:15.5px;font-weight:600}
.vsum.ok{background:var(--okb);border-color:#34c75955;color:var(--ok)}
.vsum.bad{background:var(--errb);border-color:#ff3b3055;color:var(--err)}
.vsum .big{margin-left:auto;font-family:JBMono,monospace;font-size:13px;font-weight:500;color:var(--ts)}
.aicard{border:1px solid var(--acb);background:var(--acs);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px}
.aicard .h{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ac);margin-bottom:8px}
.aicard p{font-size:14px;line-height:1.55;color:var(--tp)}
.aicard .fix{margin-top:9px;font-size:13px;color:var(--ok);display:flex;gap:7px;align-items:flex-start}

/* callout ring + magnifier */
.ring{position:absolute;border:2px solid var(--err);border-radius:var(--r-md);box-shadow:0 0 0 6px #ff3b3021;pointer-events:none}
.mag{position:absolute;border-radius:var(--r-md);border:1px solid var(--bd3);background:var(--elev);box-shadow:0 32px 64px #000000cc;overflow:hidden;padding:13px 16px}
.mag .mt{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--err);font-weight:700;margin-bottom:7px}
.mag .mv{font-family:JBMono,monospace;font-size:19px;color:var(--tp);line-height:1.5}

/* export */
.expcard{position:absolute;border-radius:var(--r-md);border:1px solid var(--bd2);background:var(--elev);box-shadow:0 20px 48px #000000b3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:182px;height:226px}
.expcard .x{font-family:JBMono,monospace;font-size:17px;font-weight:500;letter-spacing:1px}
.expcard .y{font-size:12.5px;color:var(--ts);text-align:center;padding:0 10px;line-height:1.35}
.expcard .ix{width:52px;height:52px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;border:1px solid var(--bd2)}

/* cursor */
#cur{position:absolute;width:22px;height:22px;pointer-events:none;z-index:60;filter:drop-shadow(0 2px 4px #000c)}

/* captions + chips */
#cap{position:absolute;left:0;right:0;bottom:74px;display:flex;justify-content:center;z-index:50}
#cap .box{max-width:1360px;text-align:center;font-size:33px;font-weight:500;line-height:1.42;letter-spacing:-.4px;
  background:#000000b8;border:1px solid var(--bd);border-radius:var(--r-md);padding:15px 30px;backdrop-filter:blur(8px)}
#cap .box em{font-style:normal;color:var(--ac)}
#chips{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:9px;z-index:50}
#chips span{font-family:JBMono,monospace;font-size:15px;padding:7px 14px;border-radius:99px;border:1px solid var(--bd2);background:#000000b8;color:var(--tt)}
#badge{position:absolute;z-index:55;font-family:JBMono,monospace;font-weight:500}

/* end card */
.endwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(ellipse 60% 50% at 50% 45%,#38bdf814 0%,#0000 70%),#000}
.endlogo{display:flex;align-items:center;gap:16px}
.endlogo .m{width:82px;height:82px;display:flex;align-items:center;justify-content:center}
.endlogo .m svg{width:82px;height:82px}
.endlogo .n{font-size:52px;font-weight:700;letter-spacing:-1.4px}
.endcta{height:60px;padding:0 34px;border-radius:99px;background:var(--ac);color:#00121c;font-size:21px;font-weight:600;display:flex;align-items:center;gap:11px;white-space:nowrap}
.endcta svg{width:24px;height:24px;flex:0 0 24px}
.endsub{font-size:19px;color:var(--ts)}
</style>

<div id="stage">
  <!-- ACT 1/2/4 graphic layer -->
  <div class="layer" id="gfx"></div>
  <!-- app layer -->
  <div class="layer hide" id="app">
    <div class="topbar">
      <div class="logo"><span class="m">${ICON_LOGO}</span>Netforge.ai</div>
      <div class="crumb">netforge.ai / projects / <b>remote-site</b></div>
      <div class="tbtns">
        <div class="btn" id="btnVal">Validate</div>
        <div class="btn" id="btnExp">Export</div>
        <div class="btn pri">Publish</div>
        <div class="av">TB</div>
      </div>
    </div>
    <div class="body">
      <div class="sbl" id="sbl"></div>
      <div class="cv" id="cv">
        <div class="cvinner" id="cvi">
          <svg id="links"></svg>
        </div>
      </div>
      <div class="sbr" id="sbr"></div>
    </div>
    <svg id="cur" viewBox="0 0 24 24"><path d="M5 2l14 9-6.5 1.2L9.6 19z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </div>
  <div class="layer hide" id="overlay"></div>
  <div id="cap" class="hide"><div class="box"></div></div>
  <div id="chips" class="hide"></div>
  <div id="badge" class="hide"></div>
  <div class="vig" id="vig"></div>
</div>

<script>
/* ============================ helpers ============================ */
const $=s=>document.querySelector(s), el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
// progress of t across [a,b]
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
// fade in/out envelope for a scene of length d
const env=(lt,d,fi=.45,fo=.45)=>Math.min(seg(lt,0,fi),1-seg(lt,d-fo,d));
const typed=(s,p)=>s.slice(0,Math.round(clamp(p)*s.length));

const I={
  // Netforge.ai mark, taken from the site's own /icon.svg (NetworkLogo.tsx)
  logo:'<svg viewBox="0 0 32 32"><defs><linearGradient id="nfg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/></linearGradient></defs>'
    +'<circle cx="16" cy="16" r="14.4" fill="none" stroke="url(#nfg)" stroke-width="3" stroke-opacity="0.55"/>'
    +'<circle cx="16" cy="16" r="12.4" fill="url(#nfg)"/>'
    +'<g transform="translate(16 16) scale(0.93) translate(-12 -12)" stroke="rgba(255,255,255,0.45)" stroke-width="1.5">'
    +'<line x1="5" y1="5" x2="12" y2="12"/><line x1="19" y1="5" x2="12" y2="12"/><line x1="5" y1="19" x2="12" y2="12"/><line x1="19" y1="19" x2="12" y2="12"/></g>'
    +'<g transform="translate(16 16) scale(0.93) translate(-12 -12)" fill="#fff">'
    +'<circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><circle cx="12" cy="12" r="3"/></g></svg>',
  router:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M12 3v18M7 7l10 10M17 7L7 17"/></svg>',
  switch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="10" rx="2"/><path d="M6.5 11.5h2M11 11.5h2M15.5 11.5h2"/></svg>',
  fw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l8 3.5v5c0 5-3.4 8.6-8 9.5-4.6-.9-8-4.5-8-9.5v-5z"/></svg>',
  wan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>',
  ap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12a7 7 0 0114 0M8.5 15a3.5 3.5 0 017 0"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6.5 18h11a3.5 3.5 0 000-7 5.5 5.5 0 00-10.6-1.6A3.8 3.8 0 006.5 18z"/></svg>',
  chk:'<svg viewBox="0 0 24 24" fill="none" stroke="#00120a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="#1a0000" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.1 6.3L20.5 10l-6.4 1.7L12 18l-2.1-6.3L3.5 10l6.4-1.7z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="#00121c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>'
};
document.body.innerHTML=document.body.innerHTML.replace('${ICON_LOGO}',I.logo);

const V={cisco:'#1ba0d7',arista:'#ed1c24',aruba:'#ff8300',sp:'#00adef',palo:'#ff9f0a',gen:'#8e8e93',az:'#007aff'};

/* ============================ static build: palette ============================ */
const PALETTE=[

/* ============================ seek ============================ */
let DURATION=135, TL=null;
// caption track is global and synced to the VO, so scene-local caption() calls are overridden below
function renderCues(t){
  if(!TL)return;
  const c=TL.cues.find(q=>t>=q.t0&&t<q.t1);
  if(!c){caption('',0);return}
  caption(c.html, Math.min(seg(t,c.t0,c.t0+.45), 1-seg(t,c.t1-.4,c.t1)));
}
window.seek=function(t){
  t=Math.max(0,Math.min(DURATION-.001,t));
  // reset per-frame transient state
  $('#overlay').classList.add('hide'); badge(null,'',0);
  $('#btnVal').className='btn'; $('#btnExp').className='btn';
  const sc=SCENES.find(s=>t>=s.a&&t<s.b)||SCENES[SCENES.length-1];
  if(window.__scene!==sc){ // scene entry: clear graphic caches so each scene rebuilds cleanly
    if(sc.a<56||sc.a>=105)hideApp(); window.__scene=sc;
    ['s2','s3','s4','s13','s15','s16'].forEach(k=>$('#gfx').dataset[k]='');
  }
  caption('',0); chips(null); cursorAt(0,0,false);
  sc.go(t-sc.a, sc.b-sc.a, t);
  renderCues(t);
  // global fade from/to black at the very top and tail
  $('#vig').style.background=`radial-gradient(ellipse 70% 55% at 50% 50%,#0000 0%,#000000ad 100%)`;
  document.documentElement.style.setProperty('--gfade',1);
  const g=Math.min(seg(t,0,.7),1-seg(t,DURATION-.7,DURATION));
  $('#stage').style.opacity=g;
};
fetch('timeline.json').then(r=>r.json()).then(j=>{
  TL=j; DURATION=j.duration;
  j.scenes.forEach((s,i)=>{ if(SCENES[i]){SCENES[i].a=s.a; SCENES[i].b=s.b;} });
  window.__scene=null; seek(0); window.__ready=true;
});
