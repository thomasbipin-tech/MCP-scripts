<!doctype html>
<meta charset="utf-8">
<title>Netforge.ai demo — frame renderer</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-400.woff2)format('woff2');font-weight:400;font-display:block}
@font-face{font-family:Inter;src:url(fonts/inter-500.woff2)format('woff2');font-weight:500;font-display:block}
@font-face{font-family:Inter;src:url(fonts/inter-600.woff2)format('woff2');font-weight:600;font-display:block}
@font-face{font-family:Inter;src:url(fonts/inter-700.woff2)format('woff2');font-weight:700;font-display:block}
@font-face{font-family:JBMono;src:url(fonts/jbmono-400.woff2)format('woff2');font-weight:400;font-display:block}
@font-face{font-family:JBMono;src:url(fonts/jbmono-500.woff2)format('woff2');font-weight:500;font-display:block}

:root{
  --bg:#000; --bg2:#0a0a0c; --elev:#1c1c1e;
  --bd:#ffffff1a; --bd2:#ffffff29; --bd3:#ffffff3d; --edge:#ffffff0f;
  --tp:#f5f5f7; --ts:#98989f; --tt:#aeaeb2; --tph:#48484a;
  --ac:#38bdf8; --ac2:#0ea5e9; --acs:#38bdf824; --acb:#38bdf840; --acg:#38bdf857;
  --ok:#34c759; --okb:#34c7591a; --err:#ff3b30; --errb:#ff3b301a;
  --warn:#ff9f0a; --warnb:#ff9f0a1a; --info:#007aff; --infob:#007aff1a;
  --cisco:#1ba0d7; --arista:#ed1c24; --aruba:#ff8300; --sp:#00adef; --gen:#8e8e93;
  --fiber:#007aff; --copper:#8e8e93; --down:#ff3b30;
  --dot:#ffffff29; --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --shadow-node:0 2px 12px #000000b3, 0 0 0 1px #ffffff12;
  --topbar:50px; --sbl:272px; --sbr:600px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Inter,sans-serif;color:var(--tp);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000}
.layer{position:absolute;inset:0}
.hide{display:none!important}
.mono{font-family:JBMono,monospace}

/* ---------- kinetic type ---------- */
.kin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 200px;text-align:center}
.kin .l{font-size:60px;line-height:1.22;font-weight:600;letter-spacing:-1.4px}
.kin .l.sm{font-size:44px;font-weight:500;color:var(--ts);letter-spacing:-.6px}
.kin .l.em{color:var(--ac)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 50%,#0000 0%,#000000ad 100%);pointer-events:none}


/* ---------- new short-form screens: shared page chrome ---------- */
.pg{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column}
.pgtabs{display:flex;gap:24px;padding:0 26px;border-bottom:1px solid var(--bd);background:var(--bg2);flex:0 0 46px;align-items:center}
.pgtabs div{font-size:14px;color:var(--ts);font-weight:500;padding:13px 0 11px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.pgtabs div.on{color:var(--ac);border-bottom-color:var(--ac)}
.pgbody{flex:1;padding:30px 44px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;justify-content:center}
/* column flex + margin:0 auto would shrink children to content width; keep them full-bleed */
.pgbody>*{width:100%}
.h1{font-size:30px;font-weight:600;letter-spacing:-.6px;margin-bottom:5px}
.h2{font-size:14.5px;color:var(--ts);margin-bottom:22px}
.card{border:1px solid var(--bd);background:#ffffff06;border-radius:var(--r-md)}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:99px;font-size:12.5px;font-weight:600;font-family:JBMono,monospace}
.pill.ok{background:var(--okb);color:var(--ok);border:1px solid #34c75955}
.pill.warn{background:var(--warnb);color:var(--warn);border:1px solid #ff9f0a55}
.pill.err{background:var(--errb);color:var(--err);border:1px solid #ff3b3055}
.pill.info{background:var(--infob);color:var(--info);border:1px solid #007aff55}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tt);font-weight:600;padding:0 14px 11px}
.tbl td{padding:12px 14px;border-top:1px solid #ffffff0d;font-family:JBMono,monospace;color:var(--tp);white-space:nowrap}
.tbl td.t{font-family:Inter,sans-serif}
.tbl td.dim{color:var(--ts)}

/* wizard */
.wz{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1180px;display:flex;
  border-radius:var(--r-lg);border:1px solid var(--bd2);background:var(--elev);box-shadow:0 40px 90px #000000cc;overflow:hidden}
.wzrail{width:288px;flex:0 0 288px;background:#ffffff05;border-right:1px solid var(--bd);padding:26px 22px}
.wzstep{display:flex;gap:13px;align-items:flex-start;padding:13px 0;font-size:15px;color:var(--ts)}
.wzstep .n{width:26px;height:26px;flex:0 0 26px;border-radius:99px;border:1px solid var(--bd3);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-family:JBMono,monospace}
.wzstep.on{color:var(--tp)} .wzstep.on .n{background:var(--ac);border-color:var(--ac);color:#00121c;font-weight:700}
.wzstep.done .n{background:var(--okb);border-color:#34c75966;color:var(--ok)}
.wzmain{flex:1;padding:28px 30px}
.cnt{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-radius:var(--r-sm);border:1px solid var(--bd);background:#ffffff05;margin-bottom:11px}
.cnt .lb{font-size:16px} .cnt .lb small{display:block;font-size:12.5px;color:var(--ts);margin-top:2px}
.cnt .v{font-family:JBMono,monospace;font-size:26px;font-weight:500;color:var(--ac)}
.gbtn{height:52px;border-radius:99px;background:var(--ac);color:#00121c;font-size:18px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px}

/* template gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tcard{border-radius:var(--r-md);border:1px solid var(--bd);background:#ffffff06;padding:16px;overflow:hidden}
.tcard.sel{border-color:var(--acb);background:var(--acs);box-shadow:0 0 0 1px var(--acb)}
.tcard .tn{font-size:16.5px;font-weight:600;letter-spacing:-.2px}
.tcard .tm{font-size:12.5px;color:var(--ts);font-family:JBMono,monospace;margin-top:3px}
.tcard svg{width:100%;height:96px;margin:12px 0 10px;display:block}
.tcard .tb{display:flex;gap:7px}
.tbadge{font-size:11px;font-family:JBMono,monospace;padding:4px 9px;border-radius:99px;border:1px solid var(--bd2);color:var(--tt)}

/* diff viewer */
.dv{display:flex;gap:0;border-radius:var(--r-md);border:1px solid var(--bd);overflow:hidden;font-family:JBMono,monospace;font-size:16px}
.dvcol{flex:1;min-width:0}
.dvh{padding:12px 16px;background:#ffffff08;border-bottom:1px solid var(--bd);font-size:13.5px;color:var(--ts);font-family:Inter,sans-serif}
.dvl{display:flex;gap:12px;padding:6px 16px;line-height:1.5;white-space:pre}
.dvl .g{width:14px;flex:0 0 14px;color:var(--tph);text-align:center}
.dvl .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-all}
/* Config Compare colours the row by STRUCTURE, not by side:
   green = identical, yellow = same line with edits, red = no counterpart. */
.dvl.same{background:#34c75918} .dvl.same .g{color:var(--ok)}
.dvl.edit{background:#ff9f0a28} .dvl.edit .g{color:var(--warn)}
.dvl.none{background:#ff3b3028} .dvl.none .g{color:var(--err)} .dvl.none .tx{color:#ff9b94}
.dvl.gap{background:repeating-linear-gradient(135deg,#ffffff08 0 7px,transparent 7px 14px)}
.dvl.gap .g,.dvl.gap .tx{color:var(--tph)}
.dvl .tk{font-style:normal;border-radius:4px;padding:1px 5px;background:#ff9f0a40;color:#ffd48a}
.dvl.none .tk{background:#ff3b3038;color:#ff9b94}
.sev{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
     padding:2px 8px;border-radius:99px;align-self:center;flex:0 0 auto}
.sev.major{background:var(--errb);color:#ff9b94;border:1px solid #ff3b3040}
.sev.minor{background:var(--warnb);color:#ffd48a;border:1px solid #ff9f0a40}
.dvkey{display:flex;gap:22px;align-items:center;font-family:Inter,sans-serif;font-size:14px;color:var(--ts)}
.dvkey i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:8px;vertical-align:-1px}
.dvmid{width:1px;background:var(--bd)}

/* dashboard rows */
.drow{display:flex;align-items:center;gap:18px;padding:15px 18px;border-radius:var(--r-md);
  border:1px solid var(--bd);background:#ffffff05;margin-bottom:10px}
.drow .nm{font-family:JBMono,monospace;font-size:16px;width:230px}
.drow .vd{font-size:13px;color:var(--ts);width:130px}
.drow .sp{flex:1;height:26px}
.drow .mt{font-family:JBMono,monospace;font-size:13px;color:var(--tph);width:150px;text-align:right}

/* tools grid */
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.tgcol .tgh{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:11px}
.tgi{padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--bd);background:#ffffff05;font-size:14px;margin-bottom:8px}

/* path trace */
.hop{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:var(--r-md);
  border:1px solid var(--bd);background:#ffffff05;margin-bottom:11px}
.hop .ix{width:30px;height:30px;flex:0 0 30px;border-radius:99px;background:#ffffff0f;color:var(--tt);
  display:flex;align-items:center;justify-content:center;font-family:JBMono,monospace;font-size:13px}
.hop.up .ix{background:var(--ac);color:#00121c;font-weight:700}
.hop .hn{font-family:JBMono,monospace;font-size:16.5px;width:250px}
.hop .hi{font-size:13.5px;color:var(--ts);flex:1}
.hop .hl{font-family:JBMono,monospace;font-size:15px;color:var(--ok);width:100px;text-align:right}

/* rack */
.rack{width:330px;border-radius:var(--r-md);border:1px solid var(--bd2);background:#ffffff05;padding:12px 12px 14px}
.rack .rh{font-size:12.5px;color:var(--ts);font-family:JBMono,monospace;text-align:center;padding-bottom:10px}
.ru{display:flex;align-items:center;gap:8px;height:30px;margin-bottom:4px}
.ru .un{width:26px;font-family:JBMono,monospace;font-size:11px;color:var(--tph);text-align:right}
.ru .ub{flex:1;height:100%;border-radius:5px;border:1px solid var(--bd);background:#ffffff05}
.ru .ub.f{display:flex;align-items:center;padding:0 10px;font-family:JBMono,monospace;font-size:12.5px}


/* ---------- batch 2 screens ---------- */
.form{max-width:560px}
.frow{margin-bottom:15px}
.frow label{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tt);font-weight:600;margin-bottom:6px}
.frow .fi{height:44px;border-radius:var(--r-sm);border:1px solid var(--bd2);background:#ffffff08;display:flex;align-items:center;padding:0 14px;font-size:15.5px;color:var(--tp)}
.frow .fi.ok{border-color:#34c75955;background:var(--okb)}
.chk{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ts);padding:6px 0}
.chk i{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--bd3);display:flex;align-items:center;justify-content:center;flex:0 0 18px}
.chk i svg{width:11px;height:11px}
.chk.on{color:var(--tp)} .chk.on i{background:var(--ok);border-color:var(--ok)}
.totp{display:flex;gap:10px;margin-top:6px}
.totp span{width:52px;height:62px;border-radius:var(--r-sm);border:1px solid var(--bd2);background:#ffffff08;
  display:flex;align-items:center;justify-content:center;font-family:JBMono,monospace;font-size:28px;color:var(--ac)}
.qr{width:150px;height:150px;border-radius:var(--r-sm);background:#fff;padding:9px}
.qr svg{width:100%;height:100%}

.rolegrid{width:100%;border-collapse:collapse;font-size:15px}
.rolegrid th{text-align:left;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tt);font-weight:600;padding:0 12px 12px}
.rolegrid th.c,.rolegrid td.c{text-align:center;width:110px}
.rolegrid td{padding:13px 12px;border-top:1px solid #ffffff0d;font-size:15px}
.rolegrid td.r{font-family:JBMono,monospace;color:var(--tp)}
.dot{width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center}
.dot.y{background:var(--ok)} .dot.n{background:#ffffff12}
.dot svg{width:11px;height:11px}

.proppane{display:flex;gap:0;border-radius:var(--r-md);border:1px solid var(--bd);overflow:hidden}
.propnav{width:230px;flex:0 0 230px;background:#ffffff05;border-right:1px solid var(--bd);padding:12px}
.propnav div{padding:11px 13px;border-radius:var(--r-sm);font-size:14.5px;color:var(--ts)}
.propnav div.on{background:var(--acs);color:var(--ac);font-weight:600}
.propbody{flex:1;padding:20px 24px;min-width:0}
.kv{display:flex;gap:16px;padding:11px 0;border-top:1px solid #ffffff0d;font-size:15px;align-items:center}
.kv .k{width:250px;color:var(--ts)}
.kv .v{font-family:JBMono,monospace;color:var(--tp)}
.kv .badge{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--bd2);color:var(--tt);font-family:JBMono,monospace}
.kv .badge.inh{border-color:#38bdf84d;color:var(--ac);background:var(--acs)}
.kv .badge.ovr{border-color:#ff9f0a4d;color:var(--warn);background:var(--warnb)}

.fmtgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:8px}
.fmt{border-radius:var(--r-md);border:1px solid var(--bd);background:#ffffff06;padding:20px;display:flex;gap:16px;align-items:flex-start}
.fmt .ic{width:52px;height:52px;flex:0 0 52px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;border:1px solid var(--bd2)}
.fmt .ic svg{width:26px;height:26px}
.fmt .nm{font-size:17px;font-weight:600;letter-spacing:-.2px}
.fmt .ext{font-family:JBMono,monospace;font-size:12.5px;color:var(--ac);margin-top:2px}
.fmt .ds{font-size:13.5px;color:var(--ts);margin-top:7px;line-height:1.45}

.docpg{width:250px;height:324px;border-radius:8px;background:#f5f5f7;box-shadow:0 18px 40px #000000a6;padding:18px;flex:0 0 250px}
.docpg .dt{font-size:13px;font-weight:700;color:#1d1d1f}
.docpg .ds{font-size:9px;color:#6e6e73;margin-top:2px}
.docpg .dl{height:5px;background:#d8d8dd;border-radius:2px;margin-top:7px}
.docpg .dbox{height:96px;border:1px solid #c9c9ce;border-radius:4px;margin:10px 0}

/* ---------- opening brand card: bookends the end card ---------- */
.openbrand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;transform-origin:50% 50%;
  background:radial-gradient(ellipse 60% 50% at 50% 45%,#38bdf814 0%,#0000 70%),#000}

/* ---------- act 1: two artefacts, and what disagrees between them ---------- */
.ttl{position:absolute;top:62px;left:0;right:0;text-align:center;font-size:46px;font-weight:600;letter-spacing:-1.1px}
.pane.p2{top:186px;height:700px}
.vchip{position:absolute;height:36px;display:flex;align-items:center;padding:0 15px;border-radius:var(--r-sm);
  font-family:JBMono,monospace;font-size:19px;border:1px solid var(--bd2);background:#ffffff08;white-space:nowrap}
.vchip.l{right:22px;color:var(--ts)}
.vchip.l.bad{border-color:#ff3b3055;background:var(--errb);color:#ff8b84;
  text-decoration:line-through;text-decoration-color:#ff3b30a6}
.vchip.r{left:22px;color:var(--tp)}
.vchip.r.hit{border-color:#ff9f0a5c;background:var(--warnb);color:var(--warn)}
.gapfoot{position:absolute;top:910px;left:0;right:0;text-align:center;
  font-family:JBMono,monospace;font-size:18px;color:var(--tt)}
#bridge{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;overflow:visible}

/* ---------- act 1 split ---------- */
.pane{position:absolute;top:196px;height:672px;width:760px;border-radius:var(--r-lg);background:var(--bg2);border:1px solid var(--bd);overflow:hidden}
.pane .ph{height:44px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:15px;color:var(--ts);font-weight:500}
.dotrow{display:flex;gap:6px}.dotrow i{width:10px;height:10px;border-radius:99px;display:block}
.stamp{position:absolute;right:22px;top:64px;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-xs);padding:5px 10px;font-weight:600;transform:rotate(-3deg);background:var(--warnb)}
.cli{padding:20px 22px;font-family:JBMono,monospace;font-size:16.5px;line-height:1.85;color:#c9d4de;white-space:pre-wrap}
.cli b{color:var(--ac);font-weight:500}.cli u{color:var(--ok);text-decoration:none}.cli s{color:#5f6b76;text-decoration:none}
.gaplabel{position:absolute;top:60px;font-size:17px;letter-spacing:2.6px;text-transform:uppercase;color:var(--tt);font-weight:600}

/* ---------- app chrome ---------- */
#app{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column}
.topbar{height:var(--topbar);flex:0 0 var(--topbar);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:16px;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.3px}
.logo .m{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.logo .m svg{width:24px;height:24px}
.crumb{font-size:13.5px;color:var(--ts)}.crumb b{color:var(--tp);font-weight:500}
.tbtns{margin-left:auto;display:flex;align-items:center;gap:9px}
.btn{height:32px;padding:0 15px;border-radius:99px;border:1px solid var(--bd2);background:#ffffff0a;color:var(--tp);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#00121c;font-weight:600}
.btn.on{background:var(--acs);border-color:var(--acb);color:var(--ac)}
.av{width:28px;height:28px;border-radius:99px;background:linear-gradient(135deg,#38bdf8,#0369a1);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#00121c}
.body{flex:1;display:flex;min-height:0}

/* left palette */
.sbl{width:var(--sbl);flex:0 0 var(--sbl);background:var(--bg2);border-right:1px solid var(--bd);padding:16px 12px;overflow:hidden}
.sbtitle{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tt);font-weight:600;padding:0 8px;margin:14px 0 9px}
.sbtitle:first-child{margin-top:0}
.chip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);font-size:13.5px;color:var(--tp);border:1px solid transparent}
.chip .sw{width:26px;height:26px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;border:1px solid var(--bd2)}
.chip .sw svg{width:15px;height:15px}
.chip small{margin-left:auto;font-size:11px;color:var(--tph);font-family:JBMono,monospace}
.chip.act{background:var(--acs);border-color:var(--acb)}

/* canvas */
.cv{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle,var(--dot) 1px,#0000 1.2px) 0 0/26px 26px,
  var(--bg)}
.cvinner{position:absolute;inset:0;transform-origin:50% 50%}
.node{position:absolute;width:186px;border-radius:var(--r-md);background:var(--elev);box-shadow:var(--shadow-node);border:1px solid var(--edge);overflow:hidden}
.node .nh{display:flex;align-items:center;gap:9px;padding:10px 12px 8px}
.node .ic{width:28px;height:28px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;flex:0 0 28px}
.node .ic svg{width:16px;height:16px}
.node .nm{font-size:13px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.node .vd{font-size:10.5px;color:var(--ts);font-family:JBMono,monospace;margin-top:1px}
.node .ports{display:flex;gap:3px;padding:0 12px 11px;flex-wrap:wrap}
.node .ports i{width:13px;height:7px;border-radius:2px;background:#ffffff0f;display:block}
.node .ports i.up{background:var(--ok)}
.node .ports i.fib{background:var(--fiber)}
.node.sel{box-shadow:0 0 0 2px var(--ac),0 6px 20px #38bdf866}

let curSet=[], curLinks=[];
function nodeHTML(d){
  const ports=d.ports.map(p=>`<i class="${p===2?'fib':p===1?'up':''}"></i>`).join('');
  return `<div class="nh"><span class="ic" style="background:${d.c}1a;color:${d.c}">${d.ic}</span>

function buildNodes(set,links){
  curSet=set;curLinks=links;
  const cvi=$('#cvi');
  [...cvi.querySelectorAll('.node')].forEach(n=>n.remove());
  set.forEach(d=>{const n=el('div','node'+(d.sm?' sm':''),nodeHTML(d));
    n.id='n-'+d.id; n.style.left=d.x+'px'; n.style.top=d.y+'px'; cvi.appendChild(n);});
  drawLinks(1);
}
const NW=186, NWS=126, NH=78, NHS=62;
function nctr(d){const w=d.sm?NWS:NW,h=d.sm?NHS:NH;return[d.x+w/2,d.y+h/2]}
function drawLinks(p){
  const svg=$('#links'); svg.innerHTML='';
  const by=Object.fromEntries(curSet.map(d=>[d.id,d]));
  const n=curLinks.length, show=clamp(p)*n;
  curLinks.forEach(([a,b,kind],i)=>{
    const amt=clamp(show-i); if(amt<=0)return;
    const A=by[a],B=by[b]; if(!A||!B)return;
    const [x1,y1]=nctr(A),[x2,y2]=nctr(B);
    const X=lerp(x1,x2,amt),Y=lerp(y1,y2,amt);
    const col=kind==='fiber'?'var(--fiber)':kind==='down'?'var(--down)':'var(--copper)';
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',X);ln.setAttribute('y2',Y);
    ln.setAttribute('stroke',col);ln.setAttribute('stroke-width',kind==='fiber'?2.2:1.8);
    ln.setAttribute('stroke-linecap','round');ln.setAttribute('opacity',kind==='copper'?.62:.82);
    if(kind==='copper')ln.setAttribute('stroke-dasharray','7 5');
    svg.appendChild(ln);
  });
}

const CHECKS=[

// reveal the typed config up to progress p, without splitting HTML tags
function typedMarkup(src,p){
  const plain=src.replace(/<[^>]+>/g,''), want=Math.round(clamp(p)*plain.length);
  let out='',seen=0,i=0;
  while(i<src.length&&seen<want){
    if(src[i]==='<'){const j=src.indexOf('>',i);out+=src.slice(i,j+1);i=j+1;}
    else{out+=src[i];i++;seen++;}
  }
  return {html:out,done:seen>=plain.length};
}

/* ============================ seek ============================ */
let DURATION=135, TL=null, ACTIVE=null;   // ACTIVE = the scenes this timeline actually uses
// caption track is global and synced to the VO, so scene-local caption() calls are overridden below
// absolute span of a VO line, so picture beats can be pinned to the narration
function voSpan(id){
  if(!TL) return null;
  const v=TL.vo.find(x=>x.id===id);
  return v ? {s:v.start, e:v.start+v.dur} : null;
}
function renderCues(t){
  if(!TL)return;
  const c=TL.cues.find(q=>t>=q.t0&&t<q.t1);
  if(!c){caption('',0);return}
  caption(c.html, Math.min(seg(t,c.t0,c.t0+.45), 1-seg(t,c.t1-.4,c.t1)));
}
window.seek=function(t){
  t=Math.max(0,Math.min(DURATION-.001,t));
  // reset per-frame transient state
  $('#overlay').classList.add('hide'); badge(null,'',0);
  $('#btnVal').className='btn'; $('#btnExp').className='btn';
  const list=ACTIVE||SCENES;
  const sc=list.find(s=>t>=s.a&&t<s.b)||list[list.length-1];
  if(window.__scene!==sc){ // scene entry: clear graphic caches so each scene rebuilds cleanly
    const src=(sc._src!==undefined)?sc._src:SCENES.indexOf(sc);
    if(src<3||src>=11)hideApp(); window.__scene=sc;
    ['s1','s4','s13','s15','s16','sb','n1','n2','n3','n4','n5','n6','n7','n8','n9','n10','n11','n12','n13','n14','n15','n16','n17','n18','n19','n20','n21','n22'].forEach(k=>$('#gfx').dataset[k]='');
  }
  caption('',0); chips(null); cursorAt(0,0,false);
  sc.go(t-sc.a, sc.b-sc.a, t);
  renderCues(t);
  // global fade from/to black at the very top and tail
  $('#vig').style.background=`radial-gradient(ellipse 70% 55% at 50% 50%,#0000 0%,#000000ad 100%)`;
  document.documentElement.style.setProperty('--gfade',1);
  const g=Math.min(seg(t,0,.7),1-seg(t,DURATION-.7,DURATION));
  $('#stage').style.opacity=g;
};
// ?tl= lets one scene library drive several cuts (the master plus the short-form variants)
const TL_FILE=new URLSearchParams(location.search).get('tl')||'timeline.json';
fetch(TL_FILE).then(r=>r.json()).then(j=>{
  TL=j; DURATION=j.duration;
  // an `order` array selects and re-sequences scenes; without it the timeline is 1:1
  const order=j.order||j.scenes.map((_s,i)=>i);
  ACTIVE=order.map((idx,slot)=>{
    const sc=SCENES[idx];
    return {a:j.scenes[slot].a, b:j.scenes[slot].b, go:sc.go, _src:idx};
  });
  window.__scene=null; seek(0); window.__ready=true;
});
